name: Bootstrap Zh Expert OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project snapshot
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, zipfile, pathlib
          payload = ''''''
          data = base64.b64decode(payload)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall('.')
          wf = pathlib.Path('.github/workflows/bootstrap.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit project
        shell: bash
        run: |
          git config user.name "Ykmmz"
          git config user.email "yangmengze608@gmail.com"
          git add -A
          git commit -m "feat: 初始化中文 Expert OS 治理内核 v0.1.0"
          git push origin main
