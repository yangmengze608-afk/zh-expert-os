[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-expert-os"
version = "0.3.2"
description = "中文原生、任务驱动招聘、GitHub 候选流水线与匿名评测的 AI 专家团操作系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zh Expert OS contributors"}]
dependencies = []

[project.scripts]
zh-expert-os = "zh_expert_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
